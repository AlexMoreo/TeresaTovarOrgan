# Site settings
locale: "it-IT"
title: "Teresa Tovar"
title_separator: "-"
name: "Teresa Tovar"
description: "Lezioni di pianoforte e servizi d'organo per matrimoni, funerali e battesimi a Pisa e Le Piagge."
url: "https://alexmoreo.github.io"
baseurl: "/TeresaTovarOrgan"
repository: "AlexMoreo/TeresaTovarOrgan"

logo:
og_image:

author:
  name: "Teresa Tovar"
  location: "Le Piagge, Pisa"
  bio: "Pianista e organista. Lezioni di pianoforte per bambini e adulti; servizi d'organo per matrimoni, funerali e battesimi."
  email: ""
  links: []

footer:
  links: []

# Build settings
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-remote-theme

include: ["_pages"]

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false

category_archive:
  type: liquid
  path: /categorie/
tag_archive:
  type: liquid
  path: /tag/

search: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:title/
